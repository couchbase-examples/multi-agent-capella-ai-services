[project]
name = "seinfeld-script-generator"
version = "0.1.0"
description = "A multi-agent system using CrewAI to generate Seinfeld episode scripts using Couchbase Capella AI Services"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "crewai[tools]>=1.15.41",
    "litellm>=1.110.0",
    "langchain-openai>=1.8.1,<2",
    "python-dotenv>=1.2.4",
    "pydantic>=2.11.9",
    "langchain-couchbase>=1.2.0,<2",
]

[project.scripts]
seinfeld = "seinfeld_script_generator.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seinfeld_script_generator"]


[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
